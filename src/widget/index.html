<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Widget</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="notch-container">
    <!-- Drag Handle (JS Mouse Tracking) -->
    <div class="drag-handle" id="dragHandle" title="Drag to move. Click to show or hide frame controls.">
      <svg viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="3" cy="4" r="1.5" fill="currentColor"/>
        <circle cx="3" cy="8" r="1.5" fill="currentColor"/>
        <circle cx="3" cy="12" r="1.5" fill="currentColor"/>
        <circle cx="9" cy="4" r="1.5" fill="currentColor"/>
        <circle cx="9" cy="8" r="1.5" fill="currentColor"/>
        <circle cx="9" cy="12" r="1.5" fill="currentColor"/>
      </svg>
    </div>

    <div class="action-buttons">
      <!-- Single Capture Button (Icon only) -->
      <button class="notch-icon-btn single-btn" id="singleCaptureBtn" title="Single Screenshot (PrintScreen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>

      <!-- Screen Marker / Live Annotation Button -->
      <button class="notch-icon-btn marker-btn" id="markerBtn" title="Screen Marker / Draw on Screen (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>

      <div class="advanced-controls hidden" id="advancedControls">
        <!-- Frame sequence capture button -->
        <button class="notch-icon-btn burst-btn" id="burstCaptureBtn" title="Capture animation frames">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="3" ry="3"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
          </svg>
        </button>

        <!-- Config Toggle Button -->
        <button class="notch-icon-btn config-btn" id="configBtn" title="Frame capture settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Quit App Button (Icon only) -->
      <button class="notch-icon-btn quit-btn" id="quitBtn" title="Quit Application">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <section class="frame-settings hidden" id="inlineConfig" aria-label="Frame capture settings">
    <div class="settings-heading">
      <div>
        <strong>Animation frames</strong>
        <span id="captureSummary">3 frames, 1 second apart</span>
      </div>
      <button class="reset-btn" id="resetSettingsBtn" type="button">Reset</button>
    </div>

    <div class="setting-row">
      <label for="frameCountInput">Frames</label>
      <div class="stepper-control">
        <button type="button" class="stepper-btn" data-target="frameCountInput" data-step="-1" aria-label="Decrease frame count">−</button>
        <input type="number" id="frameCountInput" min="2" max="60" value="3" inputmode="numeric">
        <button type="button" class="stepper-btn" data-target="frameCountInput" data-step="1" aria-label="Increase frame count">+</button>
      </div>
    </div>

    <div class="setting-row">
      <label for="frameIntervalInput">Every</label>
      <div class="stepper-control interval-control">
        <button type="button" class="stepper-btn" data-target="frameIntervalInput" data-step="-100" aria-label="Decrease interval">−</button>
        <input type="number" id="frameIntervalInput" min="100" max="5000" step="100" value="1000" inputmode="numeric">
        <span class="input-suffix">ms</span>
        <button type="button" class="stepper-btn" data-target="frameIntervalInput" data-step="100" aria-label="Increase interval">+</button>
      </div>
    </div>

    <div class="interval-presets" aria-label="Interval presets">
      <button type="button" data-interval="250">0.25 sec</button>
      <button type="button" data-interval="500">0.5 sec</button>
      <button type="button" data-interval="1000" class="active">1 sec</button>
      <button type="button" data-interval="2000">2 sec</button>
    </div>

    <p>Select a screen area, then each frame is copied separately to your clipboard.</p>
  </section>

  <script src="../preload-tauri.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
